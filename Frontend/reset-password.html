<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Library Management System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <!-- Logo -->
            <div class="login-logo">
                📚
            </div>

            <!-- Heading -->
            <h1>Reset Password</h1>

            <p class="login-subtitle">
                Create a new password for your account
            </p>

            <form id="resetPasswordForm">

                <!-- Username / Email -->
                <label for="resetUsername">
                    USERNAME / EMAIL
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">◉</span>

                    <input
                        type="text"
                        id="resetUsername"
                        placeholder="Enter your username/email"
                        required
                    >

                </div>


                <!-- New Password -->
                <label for="newPassword">
                    NEW PASSWORD
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">●</span>

                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Enter new password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showNewPassword"
                    >
                        Show
                    </button>

                </div>


                <!-- Confirm Password -->
                <label for="confirmPassword">
                    CONFIRM PASSWORD
                </label>

                <div class="input-wrapper">

                    <span class="input-icon">●</span>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm your new password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        id="showConfirmPassword"
                    >
                        Show
                    </button>

                </div>


                <!-- Reset Button -->
                <button
                    type="submit"
                    class="login-button"
                >
                    <span>Reset Password</span>
                    <span class="login-arrow">→</span>
                </button>

                <!-- Message -->
                <p id="resetMessage"></p>

            </form>


            <!-- Back to Login -->
            <div style="text-align: center; margin-top: 22px;">

                <a
                    href="login.html"
                    style="
                        color: #1f6feb;
                        text-decoration: none;
                        font-weight: 600;
                        font-size: 14px;
                    "
                >
                    ← Back to Login
                </a>

            </div>


            <!-- Secure Box -->
            <div class="secure-login">

                <div class="secure-icon">
                    ✓
                </div>

                <div>
                    <strong>Secure Password Reset</strong>

                    <p>
                        Your account information is protected.
                    </p>
                </div>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
